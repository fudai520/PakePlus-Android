	<!DOCTYPE html>
	<html lang="zh-CN">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	    <title>丧尸末日 - 摸鱼游戏</title>
	    <style>
	        /* 全局样式重置与基础设置 */
	        * {
	            margin: 0;
	            padding: 0;
	            box-sizing: border-box;
	        }
	        body, html {
	            width: 100%;
	            height: 100%;
	            overflow: hidden; /* 防止滚动 */
	            font-family: 'Arial', sans-serif;
	            background-color: #050505; /* 深黑背景 */
	            color: #e0e0e0;
	            display: flex;
	            justify-content: center;
	            align-items: center;
	            user-select: none; /* 禁止文本选择 */
	            -webkit-user-select: none;
	        }
	        /* 场景容器，用于切换不同阶段 */
	        #scene-container {
	            position: relative;
	            width: 100%;
	            height: 100%;
	            display: flex;
	            flex-direction: column;
	            justify-content: center;
	            align-items: center;
	            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url('https://picsum.photos/seed/zombie_bg/1080/1920');
	            background-size: cover;
	            background-position: center;
	            z-index: 1;
	        }
	        /* 黑暗扫描线效果，增加压迫感 */
	        .scanlines {
	            position: fixed;
	            top: 0;
	            left: 0;
	            width: 100%;
	            height: 100%;
	            background: repeating-linear-gradient(
	                to bottom,
	                transparent 0,
	                rgba(255, 255, 255, 0.02) 50%,
	                transparent 100%
	            );
	            background-size: 100% 4px;
	            pointer-events: none;
	            z-index: 2;
	        }
	        /* 标题容器 */
	        #intro-container {
	            text-align: center;
	            opacity: 1;
	            transition: opacity 1s ease-out;
	            z-index: 3;
	            display: flex;
	            flex-direction: column;
	            align-items: center;
	            justify-content: center;
	            height: 100%;
	        }
	        /* 游戏标题样式 */
	        h1.game-title {
	            font-size: 3rem;
	            font-weight: 900;
	            color: #ff3333; /* 血红色 */
	            text-transform: uppercase;
	            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.4);
	            margin-bottom: 10px;
	            letter-spacing: 5px;
	            animation: pulse 2s infinite alternate;
	        }
	        h2.game-subtitle {
	            font-size: 1.5rem;
	            color: #aaaaaa;
	            letter-spacing: 8px;
	            margin-top: 10px;
	            text-shadow: 0 0 5px rgba(0, 0, 0, 1);
	        }
	        /* 压迫感元素：心跳模拟 */
	        .heartbeat {
	            position: absolute;
	            width: 200px;
	            height: 200px;
	            background: radial-gradient(circle, rgba(255,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
	            border-radius: 50%;
	            animation: heartbeat-anim 1.5s infinite;
	            z-index: -1;
	            pointer-events: none;
	        }
	        /* 加载容器，初始隐藏 */
	        #loading-container {
	            position: absolute;
	            top: 0;
	            left: 0;
	            width: 100%;
	            height: 100%;
	            display: flex;
	            flex-direction: column;
	            justify-content: center;
	            align-items: center;
	            background-color: #0a0a0a;
	            opacity: 0;
	            pointer-events: none;
	            transition: opacity 1s ease-in;
	            z-index: 4;
	        }
	        /* 进度条容器 */
	        .progress-wrapper {
	            width: 80%;
	            max-width: 400px;
	            background-color: #222;
	            padding: 3px;
	            border-radius: 10px;
	            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
	            margin-top: 20px;
	        }
	        /* 进度条 */
	        .progress-bar {
	            height: 20px;
	            width: 0%;
	            background: linear-gradient(90deg, #990000, #ff3333);
	            border-radius: 8px;
	            box-shadow: 0 0 10px rgba(255, 51, 51, 0.7);
	            transition: width 0.1s linear;
	        }
	        .loading-text {
	            margin-top: 15px;
	            font-size: 1.2rem;
	            color: #ff3333;
	            letter-spacing: 2px;
	        }
	        /* 动画关键帧 */
	        @keyframes pulse {
	            0% { transform: scale(1); opacity: 0.8; }
	            100% { transform: scale(1.05); opacity: 1; }
	        }
	        @keyframes heartbeat-anim {
	            0% { transform: scale(0.8); opacity: 0.3; }
	            50% { transform: scale(1.2); opacity: 0.6; }
	            100% { transform: scale(0.8); opacity: 0.3; }
	        }
	        /* 移动端适配调整 */
	        @media (max-width: 768px) {
	            h1.game-title {
	                font-size: 2.2rem;
	                letter-spacing: 3px;
	            }
	            h2.game-subtitle {
	                font-size: 1.1rem;
	                letter-spacing: 5px;
	            }
	            .heartbeat {
	                width: 150px;
	                height: 150px;
	            }
	        }
	    </style>
	</head>
	<body>
	    <div class="scanlines"></div>
	    <div id="scene-container">
	        <!-- 第一阶段：标题展示 -->
	        <div id="intro-container">
	            <div class="heartbeat"></div>
	            <h1 class="game-title">丧尸末日</h1>
	            <h2 class="game-subtitle">摸鱼游戏</h2>
	        </div>
	        <!-- 第二阶段：加载页面 -->
	        <div id="loading-container">
	            <h2 class="loading-text">资源加载中...</h2>
	            <div class="progress-wrapper">
	                <div class="progress-bar" id="progressBar"></div>
	            </div>
	        </div>
	    </div>
	    <script>
	        // 初始化音频上下文 (需要用户交互或页面加载触发)
	        const AudioContext = window.AudioContext || window.webkitAudioContext;
	        const audioCtx = new AudioContext();
	        // 播放压迫感音效 (低频震荡 + 噪音)
	        function playOppressiveSound() {
	            if (audioCtx.state === 'suspended') {
	                audioCtx.resume();
	            }
	            // 1. 创建低频振荡器 (模拟心跳的闷响)
	            const oscillator = audioCtx.createOscillator();
	            const gainNode = audioCtx.createGain();
	            oscillator.type = 'sawtooth';
	            oscillator.frequency.setValueAtTime(50, audioCtx.currentTime); // 50Hz 低频
	            // 简单的包络，模拟心跳节奏
	            // 这里做一个持续的低频噪音背景，比单纯的心跳更有压迫感
	            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
	            oscillator.connect(gainNode);
	            gainNode.connect(audioCtx.destination);
	            oscillator.start();
	            // 2. 创建噪音缓冲 (模拟环境底噪)
	            const bufferSize = audioCtx.sampleRate * 2; // 2秒缓冲
	            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
	            const data = buffer.getChannelData(0);
	            for (let i = 0; i < bufferSize; i++) {
	                data[i] = Math.random() * 2 - 1;
	            }
	            const noise = audioCtx.createBufferSource();
	            noise.buffer = buffer;
	            noise.loop = true;
	            const noiseGain = audioCtx.createGain();
	            noiseGain.gain.value = 0.02; // 很小的音量
	            // 低通滤波器，让噪音听起来更沉闷
	            const filter = audioCtx.createBiquadFilter();
	            filter.type = 'lowpass';
	            filter.frequency.value = 400;
	            noise.connect(filter);
	            filter.connect(noiseGain);
	            noiseGain.connect(audioCtx.destination);
	            noise.start();
	            // 模拟心跳效果 (LFO控制音量)
	            const lfo = audioCtx.createOscillator();
	            lfo.type = 'sine';
	            lfo.frequency.value = 1.2; // 每分钟约72次心跳
	            const lfoGain = audioCtx.createGain();
	            lfoGain.gain.value = 0.05; // 调制深度
	            lfo.connect(lfoGain);
	            lfoGain.connect(gainNode.gain);
	            lfo.start();
	        }
	        // 页面加载完成后执行
	        window.onload = function() {
	            // 尝试播放音效 (现代浏览器可能阻止自动播放，但这是在APK内打包，通常有权限)
	            // 为了保险起见，我们尝试在第一次点击或任何事件中恢复，但在APK中直接尝试没问题。
	            playOppressiveSound();
	            const introContainer = document.getElementById('intro-container');
	            const loadingContainer = document.getElementById('loading-container');
	            const progressBar = document.getElementById('progressBar');
	            // 5秒后切换到加载界面
	            setTimeout(() => {
	                // 淡出标题
	                introContainer.style.opacity = '0';
	                setTimeout(() => {
	                    introContainer.style.display = 'none';
	                    loadingContainer.style.display = 'flex';
	                    // 强制重绘以触发 transition
	                    void loadingContainer.offsetWidth;
	                    // 淡入加载界面
	                    loadingContainer.style.opacity = '1';
	                    // 模拟进度条加载 (4秒)
	                    let progress = 0;
	                    const interval = 40; // 每40ms更新一次
	                    const step = 100 / (4000 / interval); // 计算每次增加的百分比
	                    const progressInterval = setInterval(() => {
	                        progress += step;
	                        if (progress >= 100) {
	                            progress = 100;
	                            clearInterval(progressInterval);
	                            // 加载完成后跳转
	                            setTimeout(() => {
	                                window.location.href = '丧尸末日-摸鱼游戏.html';
	                            }, 500); // 稍微停顿一下，让用户看到100%
	                        }
	                        progressBar.style.width = progress + '%';
	                    }, interval);
	                }, 1000); // 等待标题淡出动画完成
	            }, 5000); // 5秒展示时间
	        };
	    </script>
	</body>
	</html>
