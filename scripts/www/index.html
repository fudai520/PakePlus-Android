<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>摸鱼网盘 · 极速云存储</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.dark-mode {
            background: #0d1a26;
            color: #d0e4f0;
        }

        /* ===== VIP金色特效 ===== */
        body.vip-gold .container {
            border: 2px solid #FFD700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15), 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        body.vip-gold .logo-area h1 {
            color: #D4A017;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        body.vip-gold .storage-info .size span {
            color: #D4A017;
        }
        body.vip-gold .progress-fill {
            background: linear-gradient(90deg, #FFD700, #FFA500);
        }
        body.vip-gold .toolbar .btn.primary {
            background: linear-gradient(135deg, #D4A017, #B8860B);
        }
        body.vip-gold .vip-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500) !important;
            color: #5a3a00 !important;
        }
        body.vip-gold .badge {
            background: linear-gradient(135deg, #FFD700, #FFA500) !important;
            color: #5a3a00 !important;
        }
        body.vip-gold.dark-mode .container {
            border-color: #FFD700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.08), 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        body.vip-gold.dark-mode .logo-area h1 {
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
        }
        body.vip-gold.dark-mode .storage-info .size span {
            color: #FFD700;
        }

        .vip-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 215, 0, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            display: none;
            animation: glowPulse 3s ease-in-out infinite;
        }
        body.vip-gold .vip-glow {
            display: block;
        }
        @keyframes glowPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* ===== 进入动画 ===== */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #1a2a3a, #0d1a26);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .splash-screen.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        .splash-screen .logo {
            font-size: 72px;
            animation: splashFloat 1.2s ease-in-out infinite alternate;
        }
        .splash-screen .title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-top: 12px;
            letter-spacing: 4px;
        }
        .splash-screen .title span {
            color: #4FC3F7;
        }
        .splash-screen .bar {
            margin-top: 24px;
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .splash-screen .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4FC3F7, #29B6F6);
            border-radius: 10px;
            animation: splashProgress 1.8s ease forwards;
        }
        @keyframes splashFloat {
            0% { transform: translateY(-6px) scale(1); }
            100% { transform: translateY(6px) scale(1.02); }
        }
        @keyframes splashProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
            opacity: 0;
            transform: translateY(20px);
            animation: containerFadeIn 0.6s ease 2s forwards;
            transition: background 0.3s ease, box-shadow 0.5s ease, border 0.5s ease;
            position: relative;
            z-index: 1;
        }
        body.dark-mode .container {
            background: #1a2a3a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        @keyframes containerFadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eef2f6;
            transition: border-color 0.3s ease;
        }
        body.dark-mode .header {
            border-bottom-color: #2a3a4a;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-area .icon { font-size: 32px; }
        .logo-area h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: -0.5px;
            transition: color 0.5s ease;
        }
        body.dark-mode .logo-area h1 { color: #e0ecf5; }
        .logo-area .badge {
            font-size: 10px;
            background: #e3f2fd;
            color: #1565C0;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 600;
            transition: background 0.5s ease, color 0.5s ease;
        }
        body.dark-mode .logo-area .badge {
            background: #1a3a5a;
            color: #4FC3F7;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-service {
            background: linear-gradient(135deg, #4FC3F7, #0288D1);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: none;
            align-items: center;
            gap: 4px;
        }
        .btn-service:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(2, 136, 209, 0.3);
        }
        .btn-service.visible { display: inline-flex; }

        .theme-toggle {
            background: none;
            border: 1px solid #dde4ea;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            color: #1a2a3a;
        }
        body.dark-mode .theme-toggle {
            border-color: #3a4a5a;
            color: #e0ecf5;
        }
        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        body.dark-mode .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #5a6a7a;
            font-size: 13px;
            transition: color 0.3s ease;
        }
        body.dark-mode .user-info { color: #8aaec8; }
        .user-info .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4FC3F7, #0288D1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }

        /* ===== 存储条 ===== */
        .storage-bar {
            margin: 18px 0 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 12px;
            transition: background 0.3s ease;
        }
        body.dark-mode .storage-bar {
            background: #0f1f2f;
        }
        .storage-info .label {
            font-size: 12px;
            color: #7a8a9a;
            transition: color 0.3s ease;
        }
        body.dark-mode .storage-info .label { color: #6a8aaa; }
        .storage-info .size {
            font-size: 18px;
            font-weight: 700;
            color: #1a2a3a;
            transition: color 0.5s ease;
        }
        body.dark-mode .storage-info .size { color: #e0ecf5; }
        .storage-info .size span {
            color: #0288D1;
            transition: color 0.5s ease;
        }

        .progress-track {
            flex: 2;
            min-width: 100px;
            height: 6px;
            background: #e8ecf0;
            border-radius: 20px;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        body.dark-mode .progress-track { background: #1a2a3a; }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4FC3F7, #0288D1);
            border-radius: 20px;
            transition: width 0.6s ease, background 0.5s ease;
        }
        .storage-action {
            font-size: 12px;
            color: #5a7a9a;
            cursor: pointer;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #dde4ea;
            transition: 0.2s;
            background: white;
        }
        body.dark-mode .storage-action {
            background: #0f1f2f;
            border-color: #2a3a4a;
            color: #8aaec8;
        }
        .storage-action:hover {
            background: #f0f4f8;
            border-color: #b0c4d8;
        }
        body.dark-mode .storage-action:hover {
            background: #1a2a3a;
            border-color: #4a5a6a;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 12px;
            align-items: center;
            transition: background 0.3s ease;
        }
        body.dark-mode .toolbar { background: #0f1f2f; }

        .toolbar .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            color: #3a5a7a;
        }
        body.dark-mode .toolbar .btn { color: #8aaec8; }
        .toolbar .btn:hover {
            background: rgba(0, 0, 0, 0.04);
            color: #1a2a3a;
        }
        body.dark-mode .toolbar .btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #e0ecf5;
        }
        .toolbar .btn.primary {
            background: linear-gradient(135deg, #0288D1, #01579B);
            color: white;
            box-shadow: 0 2px 8px rgba(2, 136, 209, 0.2);
            transition: background 0.5s ease;
        }
        .toolbar .btn.primary:hover {
            box-shadow: 0 4px 16px rgba(2, 136, 209, 0.3);
            transform: translateY(-1px);
        }
        .toolbar .btn .icon { font-size: 14px; }
        .toolbar .spacer { flex: 1; }
        .toolbar .btn.danger { color: #e74c3c; }
        .toolbar .btn.danger:hover { background: rgba(231, 76, 60, 0.08); }
        .toolbar .btn.gold { color: #f39c12; }
        .toolbar .btn.gold:hover { background: rgba(243, 156, 18, 0.08); }

        /* ===== 面包屑 ===== */
        .breadcrumb {
            font-size: 13px;
            color: #7a8a9a;
            margin-bottom: 12px;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        body.dark-mode .breadcrumb { color: #6a8aaa; }
        .breadcrumb .crumb {
            cursor: pointer;
            color: #0288D1;
            font-weight: 500;
        }
        .breadcrumb .crumb:hover { text-decoration: underline; }
        body.dark-mode .breadcrumb .crumb { color: #4FC3F7; }
        .breadcrumb .sep { color: #8a9aaa; }

        /* ===== 文件列表 ===== */
        .file-list-header {
            display: flex;
            justify-content: space-between;
            padding: 6px 4px 10px 4px;
            color: #7a8a9a;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #eef2f6;
            transition: border-color 0.3s ease, color 0.3s ease;
        }
        body.dark-mode .file-list-header {
            color: #6a8aaa;
            border-bottom-color: #2a3a4a;
        }

        .file-list { min-height: 240px; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 6px;
            border-bottom: 1px solid #f0f2f5;
            transition: 0.15s;
            border-radius: 8px;
            cursor: default;
        }
        body.dark-mode .file-item { border-bottom-color: #1a2a3a; }
        .file-item:hover { background: #f8fafc; }
        body.dark-mode .file-item:hover { background: #0f1f2f; }

        .file-item .file-icon { font-size: 24px; width: 36px; text-align: center; flex-shrink: 0; }
        .file-item .file-info { flex: 1; min-width: 0; }
        .file-item .file-name {
            font-size: 14px;
            font-weight: 500;
            color: #1a2a3a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }
        body.dark-mode .file-item .file-name { color: #d0e4f0; }
        .file-item .file-meta {
            font-size: 11px;
            color: #8a9aaa;
            margin-top: 2px;
            transition: color 0.3s ease;
        }
        body.dark-mode .file-item .file-meta { color: #6a8aaa; }
        .file-item .file-size {
            font-size: 13px;
            color: #5a6a7a;
            flex-shrink: 0;
            margin-right: 6px;
            transition: color 0.3s ease;
        }
        body.dark-mode .file-item .file-size { color: #7a8a9a; }

        .file-item .file-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .file-item .file-actions button {
            background: none;
            border: none;
            color: #7a8a9a;
            cursor: pointer;
            font-size: 15px;
            padding: 3px 6px;
            border-radius: 6px;
            transition: 0.2s;
        }
        body.dark-mode .file-item .file-actions button { color: #5a7a8a; }
        .file-item .file-actions button:hover {
            background: rgba(0, 0, 0, 0.04);
            color: #1a2a3a;
        }
        body.dark-mode .file-item .file-actions button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #e0ecf5;
        }
        .file-item .file-actions .del:hover { color: #e74c3c; }
        .file-item .file-actions .share-btn:hover { color: #f39c12; }
        .file-item .file-actions .folder-open:hover { color: #0288D1; }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #8a9aaa;
            transition: color 0.3s ease;
        }
        body.dark-mode .empty-state { color: #6a8aaa; }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 10px; opacity: 0.3; }
        .empty-state .text { font-size: 14px; }

        /* ===== 记录弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 30px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
            transition: background 0.3s ease;
        }
        body.dark-mode .modal-card {
            background: #1a2a3a;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }
        @keyframes modalIn {
            0% { transform: scale(0.95) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-card .icon { font-size: 44px; margin-bottom: 6px; display: block; }
        .modal-card .title {
            font-size: 20px;
            font-weight: 700;
            color: #1a2a3a;
            transition: color 0.3s ease;
        }
        body.dark-mode .modal-card .title { color: #e0ecf5; }
        .modal-card .sub {
            font-size: 13px;
            color: #7a8a9a;
            margin: 4px 0 16px;
            transition: color 0.3s ease;
        }
        body.dark-mode .modal-card .sub { color: #8aaec8; }
        .modal-card .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .modal-card .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #3a5a7a;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }
        body.dark-mode .modal-card .form-group label { color: #8aaec8; }
        .modal-card .form-group input,
        .modal-card .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dde4ea;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #f8fafc;
            color: #1a2a3a;
        }
        body.dark-mode .modal-card .form-group input,
        body.dark-mode .modal-card .form-group select {
            background: #0f1f2f;
            border-color: #2a3a4a;
            color: #d0e4f0;
        }
        .modal-card .form-group input:focus,
        .modal-card .form-group select:focus {
            border-color: #0288D1;
            box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.1);
        }
        .modal-card .share-link-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 14px;
            color: #0288D1;
            font-size: 13px;
            word-break: break-all;
            border: 1px solid #eef2f6;
            margin-bottom: 14px;
            cursor: pointer;
            user-select: all;
            font-weight: 500;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        body.dark-mode .share-link-box {
            background: #0f1f2f;
            border-color: #2a3a4a;
            color: #4FC3F7;
        }
        .modal-card .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .modal-card .btn-group .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            min-width: 80px;
        }
        .modal-card .btn-group .btn.primary {
            background: linear-gradient(135deg, #0288D1, #01579B);
            color: white;
        }
        .modal-card .btn-group .btn.primary:hover {
            box-shadow: 0 4px 16px rgba(2, 136, 209, 0.25);
        }
        .modal-card .btn-group .btn.gold {
            background: #fef9e7;
            color: #f39c12;
        }
        body.dark-mode .modal-card .btn-group .btn.gold {
            background: #2a2a1a;
            color: #f39c12;
        }
        .modal-card .btn-group .btn.gold:hover {
            background: #fdf3d0;
        }
        body.dark-mode .modal-card .btn-group .btn.gold:hover {
            background: #3a3a2a;
        }
        .modal-card .btn-group .btn.close {
            background: #f0f2f5;
            color: #5a6a7a;
        }
        body.dark-mode .modal-card .btn-group .btn.close {
            background: #0f1f2f;
            color: #8aaec8;
        }
        .modal-card .btn-group .btn.close:hover {
            background: #e4e8ec;
        }
        body.dark-mode .modal-card .btn-group .btn.close:hover {
            background: #1a2a3a;
        }

        /* ===== 记录列表样式 ===== */
        .record-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 8px;
            border-bottom: 1px solid #f0f2f5;
            font-size: 13px;
            transition: border-color 0.3s ease;
        }
        body.dark-mode .record-item { border-bottom-color: #1a2a3a; }
        .record-item .record-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
        .record-item .record-info { flex: 1; }
        .record-item .record-name { font-weight: 500; color: #1a2a3a; }
        body.dark-mode .record-item .record-name { color: #d0e4f0; }
        .record-item .record-detail {
            font-size: 12px;
            color: #7a8a9a;
            margin-top: 2px;
        }
        body.dark-mode .record-item .record-detail { color: #6a8aaa; }
        .record-item .record-time {
            font-size: 11px;
            color: #8a9aaa;
            flex-shrink: 0;
        }
        body.dark-mode .record-item .record-time { color: #5a7a8a; }
        .record-type-upload { border-left: 3px solid #0288D1; padding-left: 10px; }
        .record-type-delete { border-left: 3px solid #e74c3c; padding-left: 10px; }
        .record-type-restore { border-left: 3px solid #2ecc71; padding-left: 10px; }

        /* ===== 客服聊天 ===== */
        .chat-modal .modal-card {
            max-width: 500px;
            padding: 20px 24px;
        }
        .chat-messages {
            max-height: 300px;
            overflow-y: auto;
            margin: 12px 0;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 12px;
            transition: background 0.3s ease;

            // ==================== 工具函数 ====================
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
                return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
            }

            function parseSizeToMB(sizeStr) {
                const num = parseFloat(sizeStr);
                if (sizeStr.includes('GB')) return num * 1024;
                if (sizeStr.includes('MB')) return num;
                if (sizeStr.includes('KB')) return num / 1024;
                return num / 1024 / 1024;
            }

                    '.jpg': '🖼️', '.jpeg': '🖼️', '.png': '🖼️', '.gif': '🖼️', '.bmp': '🖼️',
                    '.mp4': '🎬', '.avi': '🎬', '.mkv': '🎬', '.mov': '🎬',
                    '.mp3': '🎵', '.wav': '🎵', '.flac': '🎵',
                    '.exe': '⚙️', '.msi': '⚙️', '.apk': '📱',

                    '.py': '🐍', '.java': '☕', '.cpp': '⚡', '.c': '⚡',
                    '.psd': '🎨', '.ai': '🎨', '.svg': '📐',

                const newFile = {

            function downloadFile(file) {
                showToast(`📥 正在下载 ${file.name}...`);
                const content = `📁 文件: ${file.name}\n📅 上传时间: ${file.date || '未知'}\n📦 文件大小: ${file.size}\n🔒 校验码: ${Array.from({length: 20}, () => Math.random().toString(16).slice(2, 3)).join('')}\n\n✅ 摸鱼网盘 · 极速下载`;
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 3000);
                showToast(`✅ ${file.name} 下载完成`);

                isUploading = true;

                const fileSizeBytes = file.size;
                const fileSizeStr = formatFileSize(fileSizeBytes);
                const fileSizeMB = fileSizeBytes / 1024 / 1024;

                let baseTime = Math.min(8000, Math.max(800, fileSizeMB * 200));
                const totalDuration = baseTime * (0.8 + Math.random() * 0.4);

                const ext = file.name.includes('.') ? '.' + file.name.split('.').pop() : '';
                const icon = getFileIcon(ext);
                const date = new Date().toLocaleDateString('zh-CN');

                uploadModal.classList.add('active');
                modalProgress.style.width = '0%';
                modalProgressText.textContent = '0%';
                modalTitle.textContent = '正在上传';
                modalSub.textContent = `📁 ${file.name} (${fileSizeStr})`;
                modalIcon.textContent = '📤';

                let progress = 0;
                const startTime = Date.now();

                const interval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    progress = Math.min((elapsed / totalDuration) * 100, 100);
                    modalProgress.style.width = progress + '%';
                    modalProgressText.textContent = Math.floor(progress) + '%';

                    if (progress < 30) modalSub.textContent = `⏳ 传输中 ${file.name} (${Math.floor(progress)}%)`;
                    else if (progress < 60) modalSub.textContent = `⚡ 传输中 ${file.name} (${Math.floor(progress)}%)`;
                    else if (progress < 90) modalSub.textContent = `💾 即将完成 ${file.name} (${Math.floor(progress)}%)`;
                    else if (progress < 100) modalSub.textContent = `✅ 写入中... (${Math.floor(progress)}%)`;

                    if (progress >= 100) {
                        clearInterval(interval);
                        const path = targetPath || currentPath;
                        const newFile = {
                            id: ++fileIdCounter,
                            name: file.name,
                            size: fileSizeStr,
                            icon: icon,
                            date: date,
                            path: path,
                            isFolder: false
                        };
                        files.push(newFile);
                        totalUsedMB += fileSizeMB;
                        addRecord('upload', file.name, fileSizeStr, `上传到 ${path || '根目录'}`);
                        updateStorageUI();
                        renderFiles();

                        modalIcon.textContent = '✅';
                        modalTitle.textContent = '上传完成！';
                        modalSub.textContent = `✅ ${file.name} 已上传成功`;

                        setTimeout(() => {
                            uploadModal.classList.remove('active');
                            isUploading = false;
                            showToast(`✅ ${file.name} 上传完成`);
                        }, 500);
                    }
                }, 60);
            }

            // ==================== 分享功能 ====================
            function openShareModal(file) {
                currentShareFile = file;
                shareTitle.textContent = `🔗 分享 ${file.name}`;
                shareSub.textContent = `文件大小: ${file.size}`;
                shareCodeInput.value = shareCodeCache;
                shareLimitSelect.value = '0';
                shareExpirySelect.value = '0';
                generateShareLink();
                shareModal.classList.add('active');
            }

            function generateShareLink() {
                const code = shareCodeInput.value.trim() || 'moyu123';
                shareCodeCache = code;
                const limit = shareLimitSelect.value;
                const expiry = shareExpirySelect.value;
                const base = `https://moyu.com/share/${currentShareFile ? currentShareFile.id : 'all'}`;
                const link = `${base}?code=${code}&limit=${limit}&expiry=${expiry}&t=${Date.now().toString(36)}`;
                shareLink.textContent = link;
                shareLink.dataset.link = link;
            }

            function closeShareModal() {
                shareModal.classList.remove('active');
                currentShareFile = null;
            }

            window.copyShareLink = function() {
                const link = shareLink.dataset.link || shareLink.textContent;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(link).then(() => {
                        showToast('✅ 链接已复制到剪贴板');
                    }).catch(() => {
                        fallbackCopy(link);
                    });
                } else {
                    fallbackCopy(link);
                }
            };

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ 链接已复制到剪贴板');
            }

            window.shareViaWechat = function() {
                showToast('💬 请在微信中粘贴分享链接');
                copyShareLink();
            };

            function shareAllFiles() {
                const currentFiles = getCurrentFiles();
                if (currentFiles.length === 0) {
                    showToast('当前目录没有文件可分享');
                    return;
                }
                currentShareFile = null;
                shareTitle.textContent = `🔗 分享当前目录 (${currentFiles.length}个)`;
                const names = currentFiles.map(f => f.name).join('、');
                shareSub.textContent = `包含: ${names.length > 40 ? names.slice(0, 40) + '...' : names}`;
                shareCodeInput.value = shareCodeCache;
                shareLimitSelect.value = '0';
                shareExpirySelect.value = '0';
                generateShareLink();
                shareModal.classList.add('active');
            }

            // ==================== VIP 会员 ====================
            function renderVIP() {
                const currentVip = VIP_CONFIG[vipLevel];
                vipStatus.textContent = `当前等级：${currentVip.name} (${currentVip.storage}GB存储)`;

                let html = '';
                for (let i = 1; i < VIP_CONFIG.length; i++) {
                    const v = VIP_CONFIG[i];
                    const isOwned = vipLevel >= i;
                    const isGold = i >= 6;
                    const goldStar = isGold ? ' 🌟' : '';
                    html += `
                        <div class="vip-card" style="${isGold && isOwned ? 'border-color: #FFD700; box-shadow: 0 0 20px rgba(255,215,0,0.1);' : ''}">
                            <div>
                                <span class="vip-badge ${v.color}">${v.name}${goldStar}</span>
                                <span style="float:right; font-weight:700; color:${isOwned ? '#2ecc71' : '#e67e22'};">
                                    ${isOwned ? '✅ 已拥有' : `¥${v.price}`}
                                </span>
                            </div>
                            <div class="vip-title">${v.name} · ${v.storage}GB 存储空间${isGold ? ' 👑' : ''}</div>
                            <div class="vip-features">
                                ${v.features.map(f => `<span>✓ ${f}</span>`).join('')}
                            </div>
                            ${!isOwned ? `<button class="btn-buy-vip" data-level="${i}">立即购买 ¥${v.price}</button>` : ''}
                        </div>
                    `;
                }
                vipList.innerHTML = html;

                vipList.querySelectorAll('.btn-buy-vip').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const level = parseInt(this.dataset.level);
                        buyVIP(level);
                    });
                });
            }

            function buyVIP(level) {
                const v = VIP_CONFIG[level];
                if (!v) return;
                if (vipLevel >= level) {
                    showToast(`您已拥有 ${v.name}`);
                    return;
                }
                if (confirm(`确认购买 ${v.name} 会员？\n价格：¥${v.price}\n存储空间：${v.storage}GB\n${v.features.join('\n')}`)) {
                    vipLevel = level;
                    updateVIPBadge();
                    updateVIPEffects();
                    updateStorageUI();
                    renderVIP();
                    addRecord('folder', v.name, '—', `购买 ${v.name} 会员`);
                    showToast(`🎉 恭喜成为 ${v.name} 会员！`);
                    localStorage.setItem('moyu_vip', vipLevel);

                    if (level >= 6) {
                        setTimeout(() => {
                            openChat();
                            setTimeout(() => {
                                const botDiv = document.createElement('div');
                                botDiv.className = 'chat-msg bot';
                                botDiv.textContent = '🤖 恭喜您成为尊贵的VIP会员！🎉 您现在可以享受专属客服服务了！有任何问题随时问我～';
                                chatMessages.appendChild(botDiv);
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            }, 500);
                        }, 1000);
                    }
                }
            }

            function updateVIPBadge() {
                const v = VIP_CONFIG[vipLevel];
                vipBadge.textContent = v.name;
                if (vipLevel >= 6) {
                    vipBadge.style.background = 'linear-gradient(135deg, #FFD700, #FFA500)';
                    vipBadge.style.color = '#5a3a00';
                } else if (vipLevel > 0) {
                    vipBadge.style.background = '#f39c12';
                    vipBadge.style.color = 'white';
                } else {
                    vipBadge.style.background = '#e3f2fd';
                    vipBadge.style.color = '#1565C0';
                }
            }

            // ==================== 事件绑定 ====================

            // 夜间模式
            themeToggle.addEventListener('click', toggleTheme);

            // 客服
            serviceBtn.addEventListener('click', openChat);
            chatCloseBtn.addEventListener('click', closeChat);
            chatModal.addEventListener('click', function(e) {
                if (e.target === this) closeChat();
            });

            // 分享
            shareCodeInput.addEventListener('input', generateShareLink);
            shareLimitSelect.addEventListener('change', generateShareLink);
            shareExpirySelect.addEventListener('change', generateShareLink);
            shareCloseBtn.addEventListener('click', closeShareModal);
            shareModal.addEventListener('click', function(e) {
                if (e.target === this) closeShareModal();
            });

            // 记录
            recordBtn.addEventListener('click', function() {
                renderRecords();
                recordModal.classList.add('active');
            });
            recordCloseBtn.addEventListener('click', function() {
                recordModal.classList.remove('active');
            });
            clearRecordBtn.addEventListener('click', function() {
                if (operationRecords.length === 0) { showToast('暂无记录可清空'); return; }
                if (confirm('确定清空所有操作记录吗？')) {
                    operationRecords = [];
                    saveRecords();
                    renderRecords();
                    showToast('📋 记录已清空');
                }
            });
            recordModal.addEventListener('click', function(e) {
                if (e.target === this) recordModal.classList.remove('active');
            });

            // VIP
            vipBtn.addEventListener('click', function() {
                renderVIP();
                vipModal.classList.add('active');
            });
            vipCloseBtn.addEventListener('click', function() {
                vipModal.classList.remove('active');
            });
            vipModal.addEventListener('click', function(e) {
                if (e.target === this) vipModal.classList.remove('active');
            });

            // 上传
            uploadBtn.addEventListener('click', function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.style.display = 'none';
                document.body.appendChild(input);
                input.addEventListener('change', function(e) {
                    const file = this.files[0];
                    if (file) uploadFile(file, currentPath);
                    document.body.removeChild(input);
                });
                input.click();
            });

            // 新建文件夹
            newFolderBtn.addEventListener('click', function() {
                const name = prompt('请输入新文件夹名称：', '新文件夹');
                if (name && name.trim()) {
                    const folderName = name.trim();
                    const path = currentPath ? currentPath + '/' + folderName : folderName;
                    files.push({
                        id: ++fileIdCounter,
                        name: folderName + '/',
                        size: '—',
                        icon: '📁',
                        date: new Date().toLocaleDateString('zh-CN'),
                        path: currentPath,
                        isFolder: true
                    });
                    totalUsedMB += 0.01;
                    addRecord('folder', folderName, '—', `创建文件夹`);
                    updateStorageUI();
                    renderFiles();
                    showToast(`✅ 文件夹 "${folderName}" 已创建`);
                }
            });

            shareAllBtn.addEventListener('click', shareAllFiles);

            recycleBtn.addEventListener('click', function() {
                renderRecycleList();
                recycleSidebar.classList.add('open');
            });

            closeRecycleBtn.addEventListener('click', function() {
                recycleSidebar.classList.remove('open');
            });

            emptyRecycleBtn.addEventListener('click', emptyRecycleBin);

            sortBtn.addEventListener('click', function() {
                sortAsc = !sortAsc;
                const currentFiles = getCurrentFiles();
                currentFiles.sort((a, b) => {
                    if (a.isFolder && !b.isFolder) return -1;
                    if (!a.isFolder && b.isFolder) return 1;
                    if (sortAsc) return a.name.localeCompare(b.name);
                    return b.name.localeCompare(a.name);
                });
                const ids = currentFiles.map(f => f.id);
                const sortedFiles = [];
                for (let id of ids) {
                    const f = files.find(file => file.id === id);
                    if (f) sortedFiles.push(f);
                }
                const otherFiles = files.filter(f => !ids.includes(f.id));
                files = [...sortedFiles, ...otherFiles];
                renderFiles();
                showToast(`📋 已按名称${sortAsc ? '升序' : '降序'}排序`);
            });

            clearBtn.addEventListener('click', function() {
                const currentFiles = getCurrentFiles();
                if (currentFiles.length === 0) { showToast('当前目录没有文件'); return; }
                if (confirm('⚠️ 确定要清空当前目录所有文件吗？可到回收站恢复')) {
                    const toDelete = [...currentFiles];
                    toDelete.forEach(f => {
                        const sizeMB = parseSizeToMB(f.size);
                        totalUsedMB = Math.max(0, totalUsedMB - sizeMB);
                        recycleBin.unshift({
                            id: ++recycleIdCounter,
                            fileId: f.id,
                            name: f.name,
                            size: f.size,
                            icon: f.icon,
                            date: f.date,
                            path: f.path || '',
                            isFolder: f.isFolder || false,
                            deletedAt: new Date().toLocaleString()
                        });
                        addRecord('delete', f.name, f.size, '批量删除');
                    });
                    files = files.filter(f => !toDelete.some(d => d.id === f.id));
                    updateStorageUI();
                    renderFiles();
                    renderRecycleList();
                    showToast('🗑️ 当前目录文件已移至回收站');
                }
            });

            refreshBtn.addEventListener('click', function() {
                showToast('⟳ 正在刷新存储状态...');
                setTimeout(() => {
                    updateStorageUI();
                    showToast('✅ 刷新完成');
                }, 600 + Math.random() * 400);
            });

            // 点击空白关闭回收站
            document.addEventListener('click', function(e) {
                if (recycleSidebar.classList.contains('open')) {
                    if (!recycleSidebar.contains(e.target) && e.target !== recycleBtn && !recycleBtn.contains(e.target)) {
                        recycleSidebar.classList.remove('open');
                    }
                }
            });

            // ==================== 初始化 ====================
            function init() {
                loadTheme();
                loadRecords();

                const savedVip = localStorage.getItem('moyu_vip');
                if (savedVip) vipLevel = parseInt(savedVip);
                updateVIPBadge();
                updateVIPEffects();

                const sampleFiles = [
                    { name: '工作汇报.docx', size: '1.2 MB', icon: '📄', date: '2025-06-28', path: '' },
                    { name: '项目计划表.xlsx', size: '856 KB', icon: '📊', date: '2025-06-27', path: '' },
                    { name: '摸鱼指南.pdf', size: '3.4 MB', icon: '📕', date: '2025-06-26', path: '' },
                ];
                sampleFiles.forEach(f => {
                    files.push({
                        id: ++fileIdCounter,
                        name: f.name,
                        size: f.size,
                        icon: f.icon,
                        date: f.date,
                        path: f.path,
                        isFolder: false
                    });
                    totalUsedMB += parseSizeToMB(f.size);
                    addRecord('upload', f.name, f.size, '初始化示例文件');
                });

                const sampleFolders = ['工作文档', '照片备份', '学习资料'];
                sampleFolders.forEach(name => {
                    files.push({
                        id: ++fileIdCounter,
                        name: name + '/',
                        size: '—',
                        icon: '📁',
                        date: new Date().toLocaleDateString('zh-CN'),
                        path: '',
                        isFolder: true
                    });
                    addRecord('folder', name, '—', '初始化示例文件夹');
                });

                updateStorageUI();
                renderFiles();
                renderRecycleList();
                updateBreadcrumb();
            }

            init();
            console.log('☁️ 摸鱼网盘 v6.0 · 操作记录功能已上线');
        })();
    </script>

</body>
</html>
